onboarding = false

# Use the terminal background; keep the default Catppuccin colors.
[theme.custom]
panel_bg = "reset"

[ui]
tab_bar_right = [
  { type = "hostname" },
  { type = "datetime", format = "󰃰 %Y-%m-%d %H:%M" },
]
tab_bar_right_separator = " · "

# Only overrides; all other settings and bindings use Herdr defaults.
# Prefix: press Ctrl+a, release it, then press the following key.
[keys]
prefix = "ctrl+a"
detach = "prefix+d"
reload_config = "prefix+ctrl+shift+r"

# Herdr tabs correspond to tmux windows; workspaces group tabs.
rename_tab = "prefix+r"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+q"

# Unlike the tmux config, direct shortcuts do not detect Vim.
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"
cycle_pane_next = "prefix+o"
last_pane = "prefix+semicolon"
split_vertical = "prefix+|"
resize_mode = "prefix+ctrl+r"
toggle_sidebar = "prefix+ctrl+s"
