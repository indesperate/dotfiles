[general]
import = ["~/.config/alacritty/catppuccin-mocha.toml"]

[env]
# may use this if remote ssh doesn't contain terminal info in /usr/share/terminfo
# TERM = "xterm-256color"

[font]
normal = { family = "Maple Mono NF CN", style = "Bold" }
size = 12

[window]
dimensions = { columns = 120, lines = 30 }
padding = { x = 8, y = 5 }
dynamic_padding = true
decorations = "Full"
resize_increments = true
opacity = 0.80
blur = false

[cursor]
vi_mode_style = { shape = "Block", blinking = "On" }

[terminal]
osc52 = "OnlyCopy"

[mouse]
bindings = [
  { mouse = "Right", action = "Copy" },
]
hide_when_typing = true

[keyboard]
bindings = [
  { key = "v", mods = "Control", action = "Paste" },
  { key = "b", mods = "Control", action = "ToggleViMode" },
  { key = "c", mode = "~Search|Vi", action = "CreateNewWindow" },
  { key = "x", mode = "~Search|Vi", action = "Quit" },
  { key = "q", mode = "~Search|Vi", action = "ToggleViMode" },
  { key = "F11", action = "ToggleFullScreen" },
]

[[hints.enabled]]
command = "xdg-open" # On Linux/BSD
# command = "open" # On macOS
# command = { program = "cmd", args = [ "/c", "start", "" ] } # On Windows
hyperlinks = true
post_processing = true
persist = false
mouse.enabled = true
binding = { key = "o", mode = "~Search|Vi" }
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`]+"
