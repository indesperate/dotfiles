#:schema https://starship.rs/config-schema.json

palette = "catppuccin_mocha"
format = """
$os\
[](lavender)\
$shell\
[](grey)\
[ ](peach)\
$directory\
[](bg:yellow fg:peach)\
$git_branch\
$git_commit\
$git_status\
[](fg:yellow bg:green)\
$c\
$cpp\
$rust\
$haskell\
$python\
[](fg:green bg:sapphire)\
$username\
$hostname\
[](fg:sapphire bg:lavender)\
$time\
[ ](fg:lavender)\
$cmd_duration\
$line_break\
$character"""

add_newline = false

[git_branch]
symbol = ""
style = "bg:yellow"
format = "[[ $symbol$branch](fg:crust bg:yellow)]($style)"

[git_commit]
style = "bg:yellow fg:crust"
format = "[ $hash]($style)"

[git_status]
conflicted = "󰀧"
ahead = "󰆸×${count} "
behind = "󰆹×${count} "
diverged = "󰊢󰆸×${ahead_count}󰆹×${behind_count} "
untracked = "󰈉×${count} "
stashed = "󰆦 "
modified = "×${count} "
staged = "×${count} "
renamed = "󰄾×${count} "
deleted = "󰧵×${count} "
style = "bg:yellow"
format = "[ [($all_status$ahead_behind)](fg:crust bg:yellow)]($style)"

[character]
disabled = false
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:red)"

[directory]
style = "bg:peach fg:crust"
read_only = " 󰌾"
format = "[  $path$read_only ]($style)"
disabled = false
fish_style_pwd_dir_length = 1
truncation_length = 2

[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "bg:lavender"
disabled = false
show_notifications = true
min_time_to_notify = 45000

[os]
disabled = false
style = "fg:white"
format = "[$symbol]($style)"

[os.symbols]
Android = " "
Arch = " "
CentOS = " "
Debian = " "
Linux = " "
Macos = " "
Ubuntu = " "
Windows = "󰍲 "

[shell]
bash_indicator = ""
fish_indicator = "󰈺"
zsh_indicator = "󰬡"
nu_indicator = ""
powershell_indicator = ""
format = "[$indicator ]($style)"
style = "fg:crust bg:lavender"
disabled = false

[c]
symbol = " "
detect_extensions = ["c", "h", "cpp", "cc", "hpp"]
version_format = "${major}.${minor}"
style = "bg:green"
format = "[[ $symbol($name)-($version)](fg:crust bg:green) ]($style)"

[rust]
symbol = " "
style = "bg:green"
version_format = "${major}.${minor}"
format = "[[ $symbol($version)](fg:crust bg:green) ]($style)"

[haskell]
symbol = " "
style = "bg:green"
format = "[[ $symbol($version)](fg:crust bg:green) ]($style)"

[python]
symbol = " "
style = "bg:green fg:crust"
version_format = "${major}.${minor}"
format = "[ ${symbol}(${version})(( $virtualenv)) ]($style)"

[time]
disabled = false
time_format = "%R"
style = "bg:lavender"
format = "[[  $time](fg:crust bg:lavender)]($style)"

[username]
disabled = false
style_root = "bold bg:sapphire"
style_user = "bg:sapphire"
format = """
[  $user ]($style fg:crust)\
"""

[hostname]
ssh_symbol = "󰒋 "
disabled = false
format = """
[$ssh_symbol](bg:sapphire fg:crust)[$hostname ](bg:sapphire fg:crust)\
"""

[line_break]
disabled = false

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
